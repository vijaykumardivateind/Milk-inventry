<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Dairy Milk Management System</title>
    <style>
        body { font-family: sans-serif; background: #f0f7f4; padding: 20px; color: #333; }
        h1, h2 { text-align: center; color: #2c3e50; }
        .dashboard { display: flex; gap: 15px; max-width: 600px; margin: 0 auto 20px auto; }
        .kpi-card { flex: 1; background: white; padding: 15px; text-align: center; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border-bottom: 4px solid #3498db; }
        .kpi-card h3 { margin: 0 0 5px 0; font-size: 0.85rem; color: #7f8c8d; text-transform: uppercase; }
        .kpi-card .value { font-size: 1.5rem; font-weight: bold; color: #2c3e50; }
        .box { background: white; padding: 20px; border-radius: 8px; max-width: 600px; margin: 0 auto 20px auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .input-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-group { flex: 1; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        button:hover { background: #27ae60; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        th { background: #f8f9fa; color: #2c3e50; }
    </style>
</head>
<body>

    <h1>🥛 My Dairy Milk Manager</h1>

    <!-- QUICK DASHBOARD STATS -->
    <div class="dashboard">
        <div class="kpi-card">
            <h3>Total Litres Collected</h3>
            <div class="value" id="totalLitres">0L</div>
        </div>
        <div class="kpi-card" style="border-bottom-color: #2ecc71;">
            <h3>Total Estimated Revenue</h3>
            <div class="value" id="totalRevenue">₹0.00</div>
        </div>
    </div>

    <!-- ENTRY FORM -->
    <div class="box">
        <h2>Record Daily Milk Delivery</h2>
        <form id="milkForm">
            <div class="input-row">
                <div class="input-group">
                    <label>Customer Name:</label>
                    <input type="text" id="customerName" placeholder="e.g., Rajesh Kumar" required>
                </div>
                <div class="input-group">
                    <label>Milk Type:</label>
                    <select id="milkType">
                        <option value="Cow">Cow Milk</option>
                        <option value="Buffalo">Buffalo Milk</option>
                    </select>
                </div>
            </div>
            
            <div class="input-row">
                <div class="input-group">
                    <label>Litres Delivered:</label>
                    <input type="number" id="litres" placeholder="e.g., 5" min="0.1" step="0.1" required>
                </div>
                <div class="input-group">
                    <label>Price per Litre (₹):</label>
                    <input type="number" id="pricePerLitre" placeholder="e.g., 50" min="1" required>
                </div>
            </div>
            
            <button type="submit">Log Entry</button>
        </form>
    </div>

    <!-- LOGGED DATABASE -->
    <div class="box">
        <h2>Today's Milk Logs</h2>
        <table>
            <thead>
                <tr>
                    <th>Customer</th>
                    <th>Type</th>
                    <th>Volume</th>
                    <th>Rate</th>
                    <th>Total Cost</th>
                </tr>
            </thead>
            <tbody id="logTableBody">
                <!-- Records will show up here -->
            </tbody>
        </table>
    </div>

    <script>
        // ✅ Your unique Outlook-Bypass Google Script link is ready!
        const GOOGLE_SCRIPT_URL = "https://google.com";

        let dairyLogs = [];
        const form = document.getElementById('milkForm');
        const tableBody = document.getElementById('logTableBody');

        form.addEventListener('submit', async function(event) {
            event.preventDefault();

            const customer = document.getElementById('customerName').value;
            const type = document.getElementById('milkType').value;
            const volume = parseFloat(document.getElementById('litres').value);
            const rate = parseFloat(document.getElementById('pricePerLitre').value);
            const entryTotalCost = volume * rate;

            dairyLogs.push({
                customerName: customer,
                milkType: type,
                litres: volume,
                priceRate: rate,
                totalCost: entryTotalCost
            });

            form.reset();
            updateDairyScreen();

            // SEND DATA TO YOUR SPREADSHEET VIA GET METHOD
            try {
                const urlWithParams = `${GOOGLE_SCRIPT_URL}?customer=${encodeURIComponent(customer)}&type=${encodeURIComponent(type)}&volume=${volume}&rate=${rate}&total=${entryTotalCost.toFixed(2)}`;
                
                await fetch(urlWithParams, { method: "GET", mode: "no-cors" });
                console.log("Entry synced to Google Sheet successfully!");
            } catch (error) {
                console.error("Sheet sync failed:", error);
            }
        });

        function updateDairyScreen() {
            tableBody.innerHTML = "";
            let aggregatedLitres = 0;
            let aggregatedRevenue = 0;

            dairyLogs.forEach(function(record) {
                aggregatedLitres += record.litres;
                aggregatedRevenue += record.totalCost;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${record.customerName}</strong></td>
                    <td>${record.milkType}</td>
                    <td>${record.litres} L</td>
                    <td>₹${record.priceRate}</td>
                    <td><strong>₹${record.totalCost.toFixed(2)}</strong></td>
                `;
                tableBody.appendChild(row);
            });

            document.getElementById('totalLitres').textContent = aggregatedLitres + "L";
            document.getElementById('totalRevenue').textContent = "₹" + aggregatedRevenue.toFixed(2);
        }
    </script>
</body>
</html>
