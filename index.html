    <script>
        // ⚠️ PASTE YOUR RECONSTRUCTED URL (WITH YOUR SCRIPT ID) IN THE QUOTES BELOW:
        const GOOGLE_SCRIPT_URL = "https://google.com";

        let dairyLogs = [];
        const form = document.getElementById('milkForm');
        const tableBody = document.getElementById('logTableBody');

        form.addEventListener('submit', async function(event) {
            event.preventDefault();

            const customer = document.getElementById('customerName').value;
            const type = document.getElementById('milkType').value;
            const volume = parseFloat(document.getElementById('litres').value);
            const rate = parseFloat(document.getElementById('pricePerLitre').value);
            const entryTotalCost = volume * rate;

            dairyLogs.push({
                customerName: customer,
                milkType: type,
                litres: volume,
                priceRate: rate,
                totalCost: entryTotalCost
            });

            form.reset();
            updateDairyScreen();

            // SEND DATA VIA OUTLOOK-BYPASS METHOD
            if (!GOOGLE_SCRIPT_URL.includes("YOUR_SCRIPT_ID_HERE")) {
                try {
                    // Create an alternate parameters string link to send data smoothly
                    const urlWithParams = `${GOOGLE_SCRIPT_URL}?customer=${encodeURIComponent(customer)}&type=${encodeURIComponent(type)}&volume=${volume}&rate=${rate}&total=${entryTotalCost.toFixed(2)}`;
                    
                    await fetch(urlWithParams, { method: "GET" });
                    console.log("Entry synced to Google Sheet successfully!");
                } catch (error) {
                    console.error("Sheet sync failed:", error);
                }
            }
        });

        function updateDairyScreen() {
            tableBody.innerHTML = "";
            let aggregatedLitres = 0;
            let aggregatedRevenue = 0;

            dairyLogs.forEach(function(record) {
                aggregatedLitres += record.litres;
                aggregatedRevenue += record.totalCost;

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${record.customerName}</strong></td>
                    <td>${record.milkType}</td>
                    <td>${record.litres} L</td>
                    <td>₹${record.priceRate}</td>
                    <td><strong>₹${record.totalCost.toFixed(2)}</strong></td>
                `;
                tableBody.appendChild(row);
            });

            document.getElementById('totalLitres').textContent = aggregatedLitres + "L";
            document.getElementById('totalRevenue').textContent = "₹" + aggregatedRevenue.toFixed(2);
        }
    </script>
